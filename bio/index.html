  <style>
    :root {
      --black: #050505;
      --red: #EA0E0E;
      --white: #FFFFFF;
      --text: rgba(255, 255, 255, .86);
      --muted: rgba(255, 255, 255, .56);
      --hairline: rgba(255, 255, 255, .08);
      --display: 'Anton', 'Impact', 'Arial Narrow', sans-serif;
      --body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --radius: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { background: var(--black); -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      color: var(--white);
      font-family: var(--body);
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, p { margin: 0; }
    img { display: block; max-width: 100%; height: auto; }

    /* Fundo: a academia escura, sumindo pro preto. Fica parado no lugar (funciona no iPhone também). */
    body::before, body::after { content: ""; position: fixed; inset: 0; pointer-events: none; }
    body::before { z-index: -2; background: url("img/fundo.webp") center / cover no-repeat; opacity: .6; }
    body::after  { z-index: -1; background: linear-gradient(to bottom, rgba(5,5,5,.15) 0%, rgba(5,5,5,.7) 40%, var(--black) 80%); }

    .page {
      width: min(100% - 32px, 520px);
      margin-inline: auto;
      padding: max(36px, env(safe-area-inset-top)) 0 max(28px, env(safe-area-inset-bottom));
    }

    /* ===== Cabeçalho ===== */
    .profile { display: flex; flex-direction: column; align-items: center; text-align: center; }

    /* Foto dentro do anel vermelho do logo PP, com a cabeça saindo por cima */
    .avatar {
      position: relative;
      isolation: isolate;
      width: clamp(184px, 50vw, 220px);
      aspect-ratio: 1;
    }
    .avatar::before { /* brilho vermelho atrás do disco */
      content: "";
      position: absolute;
      z-index: -1;
      left: 50%; top: 62%;
      width: 125%; aspect-ratio: 1;
      transform: translate(-50%, -50%);
      background: radial-gradient(closest-side, rgba(234,14,14,.34), rgba(234,14,14,.1) 55%, transparent);
    }
    .avatar .ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .avatar .ring circle {
      fill: none;
      stroke: var(--red);
      stroke-width: 10;
      stroke-linecap: round;
      transform: rotate(90deg);
      transform-origin: 440px 545px;
      filter: drop-shadow(0 0 10px rgba(234,14,14,.75));
    }
    .avatar img { position: relative; width: 100%; height: 100%; }

    .name {
      margin-top: 6px;
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(40px, 11vw, 48px);
      line-height: 1;
      letter-spacing: .015em;
      text-transform: uppercase;
    }
    .handle {
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(255, 255, 255, .72);
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      border-radius: 6px;
      transition: color .2s ease;
    }
    .handle svg { width: 16px; height: 16px; flex: none; }
    .handle:hover { color: var(--white); }

    .bio {
      margin-top: 16px;
      max-width: 34ch;
      color: var(--text);
      font-size: 15.5px;
      line-height: 1.5;
      text-wrap: balance;
    }

    /* ===== Links ===== */
    .links { display: grid; gap: 14px; margin-top: 30px; }
    .pair  { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Card = arte + moldura fina desenhada POR CIMA da arte (um anel recortado),
       assim a luz aparece igual nos quatro lados, em qualquer tela. */
    @property --beam { syntax: "<angle>"; inherits: false; initial-value: 0deg; }

    .card {
      --glow: 234, 14, 14;
      position: relative;
      display: block;
      aspect-ratio: 960 / 340;
      border-radius: var(--radius);
      overflow: hidden;
      background: #141414;
      box-shadow: 0 16px 32px -16px rgba(0,0,0,.9);
      transition: box-shadow .3s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .card img { width: 100%; height: 100%; object-fit: cover; }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      padding: 1px; /* espessura da moldura */
      border-radius: inherit;
      pointer-events: none;
      background:
        conic-gradient(from var(--beam),
          transparent 0 82%,
          rgba(var(--glow), .15) 90%,
          rgba(var(--glow), .85) 97%,
          rgba(255, 255, 255, .75) 99.3%,
          transparent 100%),
        rgba(255, 255, 255, .08);
      /* recorta o miolo: sobra só o anel de 1px */
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
              mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
              mask-composite: exclude;
    }

    /* WhatsApp: mais baixo, cortando o topo e o rodapé vazios da arte e deixando ícone e texto no meio */
    .card--wa { --glow: 37, 211, 102; aspect-ratio: 21 / 10; }
    .card--wa img { object-position: 50% 47.4%; }

    /* Cards que giram no sentido anti-horário: o rastro da luz fica do outro lado.
       Alterna um card sim, um não; no par do WhatsApp, o da esquerda vai pra esquerda e o da direita pra direita. */
    .links > .card:nth-child(even)::after,
    .pair > .card:first-child::after {
      background:
        conic-gradient(from var(--beam),
          transparent 0,
          rgba(255, 255, 255, .75) .7%,
          rgba(var(--glow), .85) 3%,
          rgba(var(--glow), .15) 10%,
          transparent 18% 100%),
        rgba(255, 255, 255, .08);
    }

    /* hover (e toque no celular): só a luz atrás do card, na cor dele */
    @media (hover: hover) {
      .card:hover { box-shadow: 0 10px 38px -8px rgba(var(--glow), .55); }
    }
    .card:active { box-shadow: 0 10px 38px -8px rgba(var(--glow), .55); }
    .card:focus-visible, .handle:focus-visible {
      outline: 2px solid var(--white);
      outline-offset: 3px;
    }

    /* ===== Rodapé ===== */
    .foot {
      margin-top: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.45;
      text-align: center;
    }
    .foot img { width: 34px; height: 34px; opacity: .9; }

    /* ===== Abertura: a foto aparece, o anel se desenha em volta, o resto entra junto ===== */
    @media (prefers-reduced-motion: no-preference) {
      .avatar img   { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
      .avatar .ring circle {
        stroke-dasharray: 1;
        animation: draw 1.3s .25s cubic-bezier(.65,0,.35,1) both;
      }
      .avatar::before { animation: fade 1.2s .4s ease both; }
      .profile > :not(.avatar), .links, .foot { animation: fade .6s .55s ease both; }

      /* Luz das bordas: todos começam juntos, no topo central de cada card, e dão a volta no mesmo tempo.
         Um card vai no sentido horário, o seguinte no anti-horário. */
      .card::after     { animation: beam 24s linear infinite; }
      .card--wa::after { animation-name: beam-wa; }
      .links > .card:nth-child(even)::after,
      .pair > .card:first-child::after { animation-direction: reverse; }
    }
    /* ângulos calculados pra luz andar em velocidade constante pela borda (sem acelerar nas pontas) */
    @keyframes beam { 0%{--beam:0.0deg} 2.5%{--beam:20.9deg} 5%{--beam:37.4deg} 7.5%{--beam:48.9deg} 10%{--beam:56.8deg} 12.5%{--beam:62.4deg} 15%{--beam:66.4deg} 17.5%{--beam:69.5deg} 20%{--beam:74.8deg} 22.5%{--beam:82.3deg} 25%{--beam:90.0deg} 27.5%{--beam:97.7deg} 30%{--beam:105.2deg} 32.5%{--beam:110.5deg} 35%{--beam:113.6deg} 37.5%{--beam:117.6deg} 40%{--beam:123.2deg} 42.5%{--beam:131.1deg} 45%{--beam:142.6deg} 47.5%{--beam:159.1deg} 50%{--beam:180.0deg} 52.5%{--beam:200.9deg} 55%{--beam:217.4deg} 57.5%{--beam:228.9deg} 60%{--beam:236.8deg} 62.5%{--beam:242.4deg} 65%{--beam:246.4deg} 67.5%{--beam:249.5deg} 70%{--beam:254.8deg} 72.5%{--beam:262.3deg} 75%{--beam:270.0deg} 77.5%{--beam:277.7deg} 80%{--beam:285.2deg} 82.5%{--beam:290.5deg} 85%{--beam:293.6deg} 87.5%{--beam:297.6deg} 90%{--beam:303.2deg} 92.5%{--beam:311.1deg} 95%{--beam:322.6deg} 97.5%{--beam:339.1deg} 100%{--beam:360.0deg} }
    @keyframes beam-wa { 0%{--beam:0.0deg} 2.5%{--beam:17.2deg} 5%{--beam:31.8deg} 7.5%{--beam:42.9deg} 10%{--beam:51.1deg} 12.5%{--beam:57.2deg} 15%{--beam:61.7deg} 17.5%{--beam:66.1deg} 20%{--beam:73.6deg} 22.5%{--beam:81.6deg} 25%{--beam:90.0deg} 27.5%{--beam:98.4deg} 30%{--beam:106.4deg} 32.5%{--beam:113.9deg} 35%{--beam:118.3deg} 37.5%{--beam:122.8deg} 40%{--beam:128.9deg} 42.5%{--beam:137.1deg} 45%{--beam:148.2deg} 47.5%{--beam:162.8deg} 50%{--beam:180.0deg} 52.5%{--beam:197.2deg} 55%{--beam:211.8deg} 57.5%{--beam:222.9deg} 60%{--beam:231.1deg} 62.5%{--beam:237.2deg} 65%{--beam:241.7deg} 67.5%{--beam:246.1deg} 70%{--beam:253.6deg} 72.5%{--beam:261.6deg} 75%{--beam:270.0deg} 77.5%{--beam:278.4deg} 80%{--beam:286.4deg} 82.5%{--beam:293.9deg} 85%{--beam:298.3deg} 87.5%{--beam:302.8deg} 90%{--beam:308.9deg} 92.5%{--beam:317.1deg} 95%{--beam:328.2deg} 97.5%{--beam:342.8deg} 100%{--beam:360.0deg} }
    @keyframes rise { from { opacity: 0; transform: translateY(8px) scale(.97); } }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes fade { from { opacity: 0; } }
  </style>
