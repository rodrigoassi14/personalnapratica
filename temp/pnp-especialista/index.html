<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PNP Especialista — Endereço alterado</title>
  <link rel="canonical" href="/pnp-especialista/">
  <meta http-equiv="refresh" content="2; url=/pnp-especialista/">
  <meta name="robots" content="noindex, follow">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 540px;
      text-align: center;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 48px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }
    h1 { font-size: 28px; font-weight: 800; margin-bottom: 12px; }
    p { color: #a3a3a3; line-height: 1.6; margin-bottom: 24px; }
    .pill {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(204,0,0,0.14);
      border: 1px solid rgba(204,0,0,0.3);
      color: #ff5c5c;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 20px;
      font-weight: 700;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      background: #d92323;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      border-radius: 10px;
      letter-spacing: .02em;
      transition: transform .15s ease, background .15s ease;
    }
    a.btn:hover { background: #b91a1a; transform: translateY(-1px); }
    .hint { margin-top: 20px; font-size: 12px; color: #737373; }
  </style>
</head>
<body>
  <div class="card">
    <div class="pill">PNP Especialista</div>
    <h1>Esta página mudou de endereço.</h1>
    <p>Você está sendo redirecionado automaticamente para o novo endereço definitivo da PNP Especialista.</p>
    <a class="btn" href="/pnp-especialista/">
      IR PARA PNP ESPECIALISTA AGORA →
    </a>
    <div class="hint">Se o redirecionamento não ocorrer em 2 segundos, clique no botão acima.</div>
  </div>
</body>
</html>
